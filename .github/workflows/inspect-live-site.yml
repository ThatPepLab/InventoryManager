name: Inspect Live Inventory Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live site HTML and API headers
        run: |
          set -e
          URL="https://tpl-inventory-api.anthonyperezabo.chatgpt.site"
          echo "=== SITE HEADERS ==="
          curl -sSIL "$URL" | sed -n '1,80p'
          echo "=== SITE HTML INFO ==="
          curl -sSL "$URL" -o /tmp/live.html
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/live.html').read_text(errors='replace')
          print('HTML_LENGTH', len(html))
          for pat in ['Add Product','Add product','product','strength','dropdown','select','inventory','/inventory']:
              print('\n###', pat)
              for m in list(re.finditer(re.escape(pat), html, re.I))[:12]:
                  a=max(0,m.start()-500); b=min(len(html),m.end()+900)
                  print(html[a:b].replace('\n',' ')[:1600])
                  print('---')
          print('\n=== SCRIPT SOURCES ===')
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I): print(s)
          print('\n=== INLINE SCRIPT STARTS ===')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.I|re.S)
          for i,s in enumerate(scripts):
              print('SCRIPT',i,'LEN',len(s))
              if len(s): print(s[:4000])
          PY
          echo "=== API NO-AUTH HEADERS ==="
          curl -sSi "$URL/inventory" | sed -n '1,120p'
